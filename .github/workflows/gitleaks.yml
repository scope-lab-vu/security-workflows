name: gitleaks
on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR commits
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: ${{ github.event.pull_request.commits }}

      - name: Checkout merge group
        if: github.event_name == 'merge_group'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan PR commits
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git . --redact --verbose \
            --log-opts="--max-count=${{ github.event.pull_request.commits }}"

      - name: Scan merge group
        if: github.event_name == 'merge_group'
        run: |
          gitleaks git . --redact --verbose \
            --log-opts="${{ github.event.merge_group.base_sha }}..${{ github.event.merge_group.head_sha }}"
